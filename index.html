<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Weather App</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="weather-clear">
  <main class="weather-app">
    <header class="app-header">
      <div class="header-top">
        <div>
          <h1>Weather App</h1>

          <p class="subtitle">
            Vremea actuală și prognoza pentru următoarele 7 zile
          </p>
        </div>

        <div class="header-controls">
          <button
            id="unit-button"
            class="small-button"
            type="button"
          >
            °F
          </button>

          <button
            id="theme-button"
            class="small-button"
            type="button"
          >
            🌙
          </button>
        </div>
      </div>
    </header>

    <section class="search-section">
      <div class="search-box">
        <input
          type="text"
          id="city-input"
          placeholder="Introdu un oraș"
          autocomplete="off"
        />

        <button id="search-button" type="button">
          Caută
        </button>
      </div>

      <button id="location-button" type="button">
        📍 Folosește locația mea
      </button>
    </section>

    <section class="weather-card">
      <button
        id="favorite-button"
        class="favorite-button"
        type="button"
        title="Adaugă la favorite"
      >
        ☆
      </button>

      <div
        class="weather-icon"
        id="weather-icon"
        aria-hidden="true"
      >
        ☀️
      </div>

      <h2 id="city">București</h2>

      <p class="country" id="country">
        România
      </p>

      <p class="temperature">
        <span id="temperature">--</span>
        <span id="temperature-unit">°C</span>
      </p>

      <p id="status">
        Se încarcă datele meteo...
      </p>

      <div class="weather-details">
        <div class="detail-box">
          <span class="detail-label">
            Vânt
          </span>

          <strong>
            <span id="wind-speed">--</span>
            km/h
          </strong>
        </div>

        <div class="detail-box">
          <span class="detail-label">
            Actualizat
          </span>

          <strong id="weather-time">
            --
          </strong>
        </div>
      </div>

      <button id="refresh-button" type="button">
        Actualizează vremea
      </button>
    </section>

    <section class="saved-section">
      <div class="saved-panel">
        <div class="section-heading">
          <h2>⭐ Favorite</h2>

          <button
            id="clear-favorites-button"
            class="text-button"
            type="button"
          >
            Șterge
          </button>
        </div>

        <div
          id="favorites-container"
          class="saved-list"
        >
          <p class="empty-message">
            Nu ai orașe favorite.
          </p>
        </div>
      </div>

      <div class="saved-panel">
        <div class="section-heading">
          <h2>🕘 Căutări recente</h2>

          <button
            id="clear-recent-button"
            class="text-button"
            type="button"
          >
            Șterge
          </button>
        </div>

        <div
          id="recent-container"
          class="saved-list"
        >
          <p class="empty-message">
            Nu există căutări recente.
          </p>
        </div>
      </div>
    </section>

    <section class="forecast-section">
      <h2>Prognoza pe 7 zile</h2>

      <div
        class="forecast-container"
        id="forecast-container"
      >
        <p class="forecast-loading">
          Se încarcă prognoza...
        </p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
