<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Weather App</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="weather-clear">
  <main class="weather-app">
    <header class="app-header">
      <h1>Weather App</h1>

      <p class="subtitle">
        Vremea actuală și prognoza pentru următoarele 7 zile
      </p>
    </header>

    <div class="search-box">
      <input
        type="text"
        id="city-input"
        placeholder="Introdu un oraș"
        autocomplete="off"
      />

      <button id="search-button" type="button">
        Caută
      </button>
    </div>

    <button id="location-button" type="button">
      📍 Folosește locația mea
    </button>

    <section class="weather-card">
      <div
        class="weather-icon"
        id="weather-icon"
        aria-hidden="true"
      >
        ☀️
      </div>

      <h2 id="city">București</h2>

      <p class="country" id="country">
        România
      </p>

      <p class="temperature">
        <span id="temperature">--</span>°C
      </p>

      <p id="status">
        Se încarcă datele meteo...
      </p>

      <div class="weather-details">
        <div class="detail-box">
          <span class="detail-label">
            Vânt
          </span>

          <strong>
            <span id="wind-speed">--</span>
            km/h
          </strong>
        </div>

        <div class="detail-box">
          <span class="detail-label">
            Actualizat
          </span>

          <strong id="weather-time">
            --
          </strong>
        </div>
      </div>

      <button id="refresh-button" type="button">
        Actualizează vremea
      </button>
    </section>

    <section class="forecast-section">
      <h2>Prognoza pe 7 zile</h2>

      <div
        class="forecast-container"
        id="forecast-container"
      >
        <p class="forecast-loading">
          Se încarcă prognoza...
        </p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
